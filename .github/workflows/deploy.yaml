name: Deploy to GitHub Pages

on:
  push:
    # mainブランチにプッシュされたときに実行（必要に応じて master などに変更してください）
    branches: ["main"]

  # GitHubのActionsタブから手動でも実行できるようにする
  workflow_dispatch:

# リポジトリへの書き込み権限とGitHub Pagesの権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数のデプロイが走らないようにする設定
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # 標準的なUbuntu環境でビルド
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # 使用しているNode.jsのバージョンに合わせて変更してください
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:pages
        env:
          # 公開したGoサーバーのURLをRepository Variable VITE_API_URLに設定してください。
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist-pages"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
