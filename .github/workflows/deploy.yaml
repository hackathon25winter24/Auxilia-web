name: Deploy to GitHub Pages

on:
  push:
  # mainブランチにプッシュされたときに実行（必要に応じて master などに変更してください）
    branches: ["main"]

  # GitHubのActionsタブから手動でも実行できるようにする
  workflow_dispatch:

# リポジトリへの書き込み権限とGitHub Pagesの権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数のデプロイが走らないようにする設定
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
  # 標準的なUbuntu環境でビルド
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # 使用しているNode.jsのバージョンに合わせて変更してください
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # ※もしVite等でリポジトリ名をパスに含める必要がある場合は環境変数が必要になることがあります

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ビルド成果物の出力ディレクトリを指定（Viteなら 'dist'、CRAなら 'build'）
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4